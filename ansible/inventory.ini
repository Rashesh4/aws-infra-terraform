# =============================================================================
# Static Inventory — Update with EC2 public IP after `terraform apply`
# For production use, consider using the aws_ec2 dynamic inventory plugin
# =============================================================================

[webservers]
# Replace <EC2_PUBLIC_IP> with actual IP from: terraform -chdir=environments/dev output ec2_public_ip
web1 ansible_host=18.206.127.92

[webservers:vars]
ansible_user=ec2-user
ansible_ssh_private_key_file=~/.ssh/aws-infra-key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
